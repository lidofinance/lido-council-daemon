name: Tests and checks
on: pull_request
jobs:
  unit_tests:
    name: Unit and E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Set up node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run build
        run: yarn build
      - name: Run typecheck
        run: yarn typecheck
      - name: Run lint
        run: yarn lint
      - name: Run tests
        run: yarn test
      - name: Run e2e transports
        run: docker compose -f docker-compose.test.yml up -d
      - name: Run e2e tests
        run: |
          WALLET_PRIVATE_KEY="$(node -e "process.stdout.write(require('ethers').Wallet.createRandom().privateKey)")" yarn test:e2e
        env:
          RPC_URL: ${{ secrets.E2E_RPC_URL }}
          CHAIN_ID: 560048
          LOCATOR_DEVNET_ADDRESS: "0xe2EF9536DAAAEBFf5b1c130957AB3E80056b06D8"
          PROVIDERS_URLS: http://127.0.0.1:8545
          EVM_CHAIN_DATA_BUS_PROVIDER_URL: http://127.0.0.1:8545
          EVM_CHAIN_DATA_BUS_CHAIN_ID: 560048
          KEYS_API_URL: http://127.0.0.1:3000
      - name: Stop e2e transports
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes


